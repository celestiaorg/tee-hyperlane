# The measured configuration for the shared CVM: every origin's enclave, each on its own port.
# Generated by `teeism images` from deploy/docker-compose.<chain>.yml; do not edit.
#
# This file's hash becomes `compose-hash` in RTMR3, so every ISM attested from this CVM pins
# all of it: changing any one image here moves the identity of every chain in it. A chain
# deployed alone (`teeism enclaves up --chain <chain>`) measures only its own file instead.
services:
  celestia:
    image: ghcr.io/jonas089/tee-node@sha256:95b42f87cabf9ae5298933f48fd975477bad9add9e8c79d26fd1b4079a470f5c
    ports:
      - "8080:8080"
    volumes:
      # The only thing the enclave talks to, and it is local. No data volume: the enclave is
      # stateless, so there is nothing to persist and nothing to seal.
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - RUST_LOG=info
  ethereum:
    image: ghcr.io/jonas089/tee-node@sha256:cb3fa8e82dbcc4d3257fe4365172f894af5eb7d3ae14f51bbd13015c60c3b045
    ports:
