# The measured configuration. This file's hash becomes `compose-hash` in RTMR3, and the
# circuit pins that value - so this file, including the image digest below, is what an ISM
# ultimately commits to.
#
# Pinned by digest: a tag can be repointed, and a repointed tag would mean a different
# binary under the same measurement claim.
#
# Both nodes run this identical file. They differ only by which origin a request names,
# which is why one identity policy and one pair of vkeys covers both.
services:
  tee-node:
    image: ghcr.io/jonas089/tee-node@sha256:f20a1596c07cd0058d09f8e66928cc9bdb4a92c9af6e9628927ca1e6eec4ed82
    ports:
      - "8080:8080"
    volumes:
      # The only thing the enclave talks to, and it is local. No data volume: the enclave is
      # stateless by design, so there is nothing to persist and nothing to seal.
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - RUST_LOG=info
