# The bridge UI and the chain it talks to, on one origin.
#
# Port 3000 rather than 80: this host forwards 80 and 3000 from the outside, and 80 is held
# by an unrelated service. 26657 and 1317 are not forwarded at all, which is why the chain is
# reached through here rather than directly. That is what lets Keplr point at the server IP.

server {
    listen 3000;
    server_name _;

    # A proxied path has to answer on both spellings. nginx redirects /rpc to /rpc/ with a
    # 301, and a client that POSTs (CosmJS does, to the RPC root) gets the redirect's HTML
    # body instead of a JSON reply, which surfaces as "Unexpected token '<'". `last` rewrites
    # internally, so no redirect ever reaches the client.
    rewrite ^/(rpc|rest|celestia|api|evm/[a-z]+)$ /$1/ last;

    root /opt/bridge-app;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Comet RPC. Keplr signs against this one, and it is also what the UI polls for height.
    #
    # The upstream already sets cors_allowed_origins = ["*"], and a Keplr request does not
    # come from this origin, so those headers have to survive the proxy rather than be
    # replaced here. Adding our own would send the header twice and the browser drops both.
    location /rpc/ {
        proxy_pass http://127.0.0.1:26657/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Comet serves subscriptions over a websocket on this same path.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Cosmos REST. Keplr reads the account number and sequence from here before signing.
    location /rest/ {
        proxy_pass http://127.0.0.1:1317/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # The name the UI has always used for REST. Kept so an older build keeps working.
    location /celestia/ {
        proxy_pass http://127.0.0.1:1317/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # The EVM RPCs the browser reads balances and delivery status from.
    #
    # Proxied rather than called directly: the public endpoints rate limit, and a rate-limited
    # answer is an HTML error page, which reaching JSON.parse reads as "Unexpected token '<'".
    # The upstream key lives here on the server and never reaches the page.
    location /evm/sepolia/ {
        proxy_pass ALCHEMY_ETH/;
        proxy_set_header Host eth-sepolia.g.alchemy.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }
    location /evm/arbitrum/ {
        proxy_pass ALCHEMY_ARB/;
        proxy_set_header Host arb-sepolia.g.alchemy.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }
    location /evm/base/ {
        proxy_pass ALCHEMY_BASE/;
        proxy_set_header Host base-sepolia.g.alchemy.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
