# The measured configuration for the devnet enclave.
#
# This file's hash becomes `compose-hash` in RTMR3, and the TEE ISM pins that value, so this
# file - including the image digest below - is what an ISM ultimately commits to.
#
# Pinned by digest rather than by tag: a tag can be repointed, and a repointed tag would mean
# a different binary under the same measurement claim.
#
# Deliberately not byte-identical to deploy/docker-compose.yml. That one measures the live
# testnet enclaves; this one measures a throwaway. Keeping them distinct means a devnet
# enclave can never satisfy a testnet ISM's identity, or the other way round.
services:
  tee-node:
    image: ghcr.io/jonas089/tee-node@sha256:77283ad03dd5f2dfbbbb718e4b08f63397ce829c48a4e3cc7b3635d18fe3e0d8
    ports:
      - "8080:8080"
    volumes:
      # The only thing the enclave talks to, and it is local. No data volume: the enclave is
      # stateless by design, so there is nothing to persist and nothing to seal.
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - RUST_LOG=info
      - TEE_NODE_PROFILE=devnet
