# The bridge's Celestia chain: one validator. `teeism celestia up` creates the genesis in the
# bind-mounted home on the host and starts this; the container only runs the node.
services:
  celestia:
    image: ${CELESTIA_IMAGE:?set by teeism celestia up}
    container_name: teeism-celestia
    entrypoint: ["celestia-appd"]
    command:
      - start
      - --home=/home/celestia/.celestia-app
      - --api.enable
      - --grpc.enable
      - --force-no-bbr
    # The home is a bind mount, so the node writes as whoever owns it on the host.
    user: "${CELESTIA_UID:?set by teeism celestia up}"
    volumes:
      - ${CELESTIA_HOME:?set by teeism celestia up}:/home/celestia/.celestia-app
    ports:
      - "26657:26657"   # comet rpc
      - "1317:1317"     # cosmos rest
      - "9090:9090"     # grpc
    stop_grace_period: 10s
    # Runs continuously, so it must come back after a reboot or a crash.
    restart: unless-stopped
